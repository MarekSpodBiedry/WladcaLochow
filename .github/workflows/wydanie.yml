name: Wydanie

# Buduje grę, uruchamia testy i publikuje plik wladca-lochow.jar jako wydanie na GitHubie.
# Uruchamiane ręcznie (Actions -> Wydanie -> Run workflow) albo przez wypchnięcie tagu v*.

on:
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer wersji bez litery v, np. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ustal wersję i tag
        id: wersja
        env:
          WERSJA_Z_FORMULARZA: ${{ inputs.wersja }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${WERSJA_Z_FORMULARZA}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Niepoprawna wersja: $tag (oczekiwany format: v1.2.3)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Zbuduj i przetestuj
        run: mvn -B package

      - name: Opublikuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.wersja.outputs.tag }}
        run: |
          cat > opis.md <<'OPIS'
          ## Jak zagrać

          1. Zainstaluj Javę 21 lub nowszą.
          2. Pobierz plik `wladca-lochow.jar` z listy poniżej.
          3. Kliknij go dwukrotnie: gra sama otworzy okno terminala.

          Jeśli dwuklik nie działa, otwórz terminal i wpisz `java -jar wladca-lochow.jar`.
          Okno terminala powinno mieć co najmniej 108 × 30 znaków.
          OPIS
          gh release create "$TAG" target/wladca-lochow.jar \
            --title "Władca Lochów ${TAG#v}" \
            --notes-file opis.md \
            --target "$GITHUB_SHA"
