name: Wydanie

# Buduje grę, uruchamia testy i publikuje plik wladca-lochow.jar jako wydanie na GitHubie.
#
# Wydanie powstaje na trzy sposoby:
#   1. zmiana numeru <version> w pom.xml na głównej gałęzi (numer wydania bierze się z pom.xml),
#   2. ręcznie: Actions -> Wydanie -> Run workflow,
#   3. wypchnięcie tagu v1.2.3.
# Jeśli wydanie o danym numerze już istnieje, workflow nic nie robi.

on:
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer wersji bez litery v, np. 1.0.1 (puste = numer z pom.xml)"
        required: false
        default: ""
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "pom.xml"
      - ".github/workflows/wydanie.yml"

permissions:
  contents: write

jobs:
  wydanie:
    # Zwykłe wypchnięcie publikuje tylko z głównej gałęzi repozytorium.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ustal wersję
        id: wersja
        env:
          GH_TOKEN: ${{ github.token }}
          WERSJA_Z_FORMULARZA: ${{ inputs.wersja }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${WERSJA_Z_FORMULARZA}" ]; then
            tag="v${WERSJA_Z_FORMULARZA}"
          else
            tag="v$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Niepoprawna wersja: $tag (oczekiwany format: v1.2.3)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Wydanie $tag już istnieje, nie ma nic do zrobienia."
            echo "nowe=nie" >> "$GITHUB_OUTPUT"
          else
            echo "nowe=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Sprawdź, czy instalator odpowiada źródłu
        if: steps.wersja.outputs.nowe == 'tak'
        run: python3 narzedzia/zbuduj-instalator.py --sprawdz

      - name: Zbuduj i przetestuj
        if: steps.wersja.outputs.nowe == 'tak'
        run: |
          mvn -B package
          cd target
          sha256sum wladca-lochow.jar > wladca-lochow.jar.sha256

      - name: Opublikuj wydanie
        if: steps.wersja.outputs.nowe == 'tak'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.wersja.outputs.tag }}
        run: |
          cat > opis.md <<'OPIS'
          ## Windows: instalator

          Wklej do PowerShella:

          ```
          irm https://raw.githubusercontent.com/MarekSpodBiedry/WladcaLochow/main/install.ps1 | iex
          ```

          Instalator sam pobierze grę (a gdy trzeba, także Javę) i zrobi skrót na pulpicie.

          ## Linux i macOS

          1. Zainstaluj Javę 21 lub nowszą.
          2. Pobierz plik `wladca-lochow.jar` z listy poniżej.
          3. Kliknij go dwukrotnie albo wpisz w terminalu `java -jar wladca-lochow.jar`.

          Okno terminala powinno mieć co najmniej 108 × 30 znaków.
          OPIS
          pliki="target/wladca-lochow.jar target/wladca-lochow.jar.sha256"
          if [ -f zasoby/ikona.ico ]; then
            cp zasoby/ikona.ico target/ikona.ico
            pliki="$pliki target/ikona.ico"
          fi
          gh release create "$TAG" $pliki \
            --repo "$GITHUB_REPOSITORY" \
            --title "Władca Lochów ${TAG#v}" \
            --notes-file opis.md \
            --target "$GITHUB_SHA"
